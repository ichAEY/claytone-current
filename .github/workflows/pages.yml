name: Deploy ClayTone to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply TANEM master data
        run: node scripts/generate-site.mjs

      - name: Remove old exported Next assets
        run: rm -rf public/_next

      - name: Ignore hosting-only TypeScript files for Pages build
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'tsconfig.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.exclude = [
            ...(config.exclude || []),
            'db/**',
            'worker/**',
            'examples/**',
            'build/**',
            'drizzle/**',
            'drizzle.config.ts',
            'vite.config.ts'
          ];
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build static site
        run: npx next build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
